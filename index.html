<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Calculator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="calculator-app">
    <div class="calculator-card">
      <!-- Header -->
      <div class="calc-header">
        <div class="window-dots">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>
        <span class="app-title">Precision Calculator</span>
        <button id="history-toggle-btn" class="icon-btn" title="Calculation History" aria-label="Toggle History">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </button>
      </div>

      <!-- Display Area -->
      <div class="display-container">
        <div id="previous-operand" class="previous-operand"></div>
        <div id="current-operand" class="current-operand">0</div>
      </div>

      <!-- Mode / Quick Controls -->
      <div class="quick-bar">
        <div class="mode-toggles">
          <button id="deg-rad-btn" class="pill-btn active" data-unit="DEG">DEG</button>
          <button id="sci-toggle-btn" class="pill-btn">Sci FX</button>
        </div>
        <div class="memory-chips">
          <button class="mem-btn" data-action="mc" title="Memory Clear">MC</button>
          <button class="mem-btn" data-action="mr" title="Memory Recall">MR</button>
          <button class="mem-btn" data-action="m-plus" title="Memory Add">M+</button>
          <button class="mem-btn" data-action="m-minus" title="Memory Subtract">M-</button>
        </div>
      </div>

      <!-- Scientific Drawer (Expandable) -->
      <div id="scientific-pad" class="scientific-pad collapsed">
        <button class="btn btn-sci" data-action="sin">sin</button>
        <button class="btn btn-sci" data-action="cos">cos</button>
        <button class="btn btn-sci" data-action="tan">tan</button>
        <button class="btn btn-sci" data-action="pi">π</button>
        <button class="btn btn-sci" data-action="e">e</button>

        <button class="btn btn-sci" data-action="sqrt">√x</button>
        <button class="btn btn-sci" data-action="sqr">x²</button>
        <button class="btn btn-sci" data-action="pow">xʸ</button>
        <button class="btn btn-sci" data-action="log">log</button>
        <button class="btn btn-sci" data-action="ln">ln</button>

        <button class="btn btn-sci" data-action="inv">1/x</button>
        <button class="btn btn-sci" data-action="fact">n!</button>
        <button class="btn btn-sci" data-action="open-paren">(</button>
        <button class="btn btn-sci" data-action="close-paren">)</button>
        <button class="btn btn-sci" data-action="mod">mod</button>
      </div>

      <!-- Main Keypad -->
      <div class="keypad">
        <button class="btn btn-action" data-action="clear">AC</button>
        <button class="btn btn-action" data-action="delete">⌫</button>
        <button class="btn btn-action" data-action="percent">%</button>
        <button class="btn btn-operator" data-operator="÷">÷</button>

        <button class="btn btn-number" data-number="7">7</button>
        <button class="btn btn-number" data-number="8">8</button>
        <button class="btn btn-number" data-number="9">9</button>
        <button class="btn btn-operator" data-operator="×">×</button>

        <button class="btn btn-number" data-number="4">4</button>
        <button class="btn btn-number" data-number="5">5</button>
        <button class="btn btn-number" data-number="6">6</button>
        <button class="btn btn-operator" data-operator="-">−</button>

        <button class="btn btn-number" data-number="1">1</button>
        <button class="btn btn-number" data-number="2">2</button>
        <button class="btn btn-number" data-number="3">3</button>
        <button class="btn btn-operator" data-operator="+">+</button>

        <button class="btn btn-action" data-action="negate">±</button>
        <button class="btn btn-number" data-number="0">0</button>
        <button class="btn btn-number" data-number=".">.</button>
        <button class="btn btn-equals" data-action="calculate">=</button>
      </div>
    </div>

    <!-- History Panel -->
    <aside id="history-panel" class="history-panel collapsed">
      <div class="history-header">
        <h3>History</h3>
        <button id="clear-history-btn" class="text-btn">Clear All</button>
      </div>
      <div id="history-list" class="history-list">
        <p class="empty-notice">No past calculations yet.</p>
      </div>
    </aside>
  </div>

  <script src="script.js"></script>
</body>
</html>
